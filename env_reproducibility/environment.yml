# Direct imports and runtime tools; exact current resolution is in locks/.
# This specification targets Linux x86_64 with the current CUDA build.
# See ENVIRONMENT.md for the two-step installation that preserves Conda OpenCV.
name: pain-assessment-video
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10.11
  - pip=24.2
  - setuptools=75.1.0
  # Keep the supported PyTorch / vision / audio / CUDA combination together.
  - pytorch::pytorch=2.5.1
  - pytorch::torchvision=0.20.1
  - pytorch::torchaudio=2.5.1
  - pytorch::pytorch-cuda=11.8
  - pytorch::pytorch-mutex=1.0=cuda
  # Preserve the observed numerical and CUDA support libraries during a fresh solve.
  - defaults::mkl=2023.1.0
  - nvidia::libcurand=10.3.5.147
  - nvidia::libcufile=1.9.1.3
  - defaults::numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.14.1
  - scikit-learn=1.6.0
  - scikit-image=0.25.2
  - matplotlib=3.9.2
  - seaborn=0.13.2
  - opentsne=1.0.2
  - umap-learn=0.5.11
  - pillow=11.0.0
  - defaults::opencv=4.10.0
  - defaults::ffmpeg=4.2.2
  - moviepy=1.0.3
  - dataframe_image=0.1.1
  - einops=0.8.1
  - timm=1.0.15
  - torchmetrics=1.5.2
  - transformers=4.57.1
  # Compatibility anchors for the current transformers binary/tokenizer stack.
  - huggingface_hub=0.36.0
  - tokenizers=0.22.1
  - pyyaml=6.0.2
  - packaging=24.2
  - psutil=6.1.0
  - tqdm=4.67.1
  - networkx=3.4.2
  - tensorboard=2.19.0
  - ipykernel=6.29.5
  - ipython=8.29.0
  # These direct imports are MISSING from the captured environment.
  # Pins below come from the dry-run solve, not from the active snapshot.
  - nltk=3.10.3
  - tensorboardx=2.6.2.2
  - submitit=1.5.4
  - h5py=3.7.0
  - webdataset=1.0.2
  - configargparse=1.7.5
  - pip:
      - av==13.1.0
      - decord==0.6.0
      - mediapipe==0.10.5
      - coral-pytorch==1.4.0
      - torch-optimizer==0.3.0
      - optuna==4.3.0
      - optunahub==0.3.1
      - safetensors==0.4.5
      - pytest==9.0.2
      # MediaPipe 0.10.5 requires protobuf <4. Avoid OpenCV pip overlays.
      - protobuf==3.20.3
      # Install from repository root; preserved wheel is CPython 3.10 / pt25 / cu118.
      - ./locks/artifacts/torchsort-0.1.10+pt25cu118-cp310-cp310-linux_x86_64.whl
      # Missing legacy imports; pins resolved separately, absent from the snapshot.
      - conditional==2.2
      - tree-format==0.1.2
