# --- Sweep axes (lists) ---
num_anchors: [100]
anchor_selection_type: [balance_class_random]
csv_anchor_selection: [train]
old_model_csv: [test]
interpolation_similarity: [autoencoder]
weighting_method: [none]
mlp_activation: [gelu]    # default; ignored for non-mlp interps
mlp_num_layers: [1]          # default; ignored for non-mlp interps
rbf_sigma: [1.0]          # default; ignored when weighting_method=none
num_refinement_samples: [-1]  # -1 uses the full source train split; 0 uses the trial num_anchors; positive values use that explicit budget. Selection always reuses --anchor_selection_type.

# --- Optuna settings ---
n_trials: null            # null + grid -> full grid
optuna_sampler: grid      # default
seed: [42]
run_tag: ablation_paper_frozen_rnd_adapter/mintVmae_to_unbcDfer_cross_validation/refinement4_autoencoder
refinement: 4             # random frozen projector; head-only refinement

linear_projector:
  lr: [1.0e-5]
  batch_size: [64]
  optimizer: adamw
  weight_decay: 0
  epochs: 1500
  encoder_ratio: [4]   # ratio of encoder hidden dim to latent dim (default=2)
  normalize_embeddings: [false]
  loss: [mse]

refinement_config:
  lr_projector: [1.0e-4]            # useless for l2 interp but set for consistency with recipe
  lr_linear: [1.0e-5]  
  lambda_B: [1.0e-4]
  lambda_A: [1.0e-3]
  optimizer: adamw
  weight_decay: 0
  epochs: 250
  loss: [mse]
  batch_size: 64
