# --- Sweep axes (lists) ---
num_anchors: [100]
anchor_selection_type: [balance_class_quality]
csv_anchor_selection: [train]
old_model_csv: [test]
interpolation_similarity: [mlp]
weighting_method: [none]
mlp_activation: [gelu]    # default; ignored for non-mlp interps
mlp_num_layers: [1]          # default; ignored for non-mlp interps
rbf_sigma: [1.0]          # default; ignored when weighting_method=none
num_refinement_samples: [-1]  # -1 uses the full source train split; 0 uses the trial num_anchors; positive values use that explicit budget. Selection always reuses --anchor_selection_type.

# --- Optuna settings ---
n_trials: null            # null + grid -> full grid
